name: Release

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.8.0)'
        required: false

permissions:
  contents: write

jobs:
  check-version:
    name: Check Version Change
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if Version Changed
        id: check
        run: |
          # Case 1: Triggered by manual workflow_dispatch
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            INPUT_VER="${{ inputs.version }}"
            if [ -n "$INPUT_VER" ]; then
              TAG="$INPUT_VER"
            else
              VER=$(grep -E '^\s*Version\s*=\s*"[^"]+"' version/version.go | sed -E 's/.*"([^"]+)".*/\1/')
              TAG="v${VER#v}"
            fi
            echo "Triggered manually: $TAG"
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "version=$TAG" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Case 2: Triggered by Git Tag push (v*)
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            echo "Triggered by tag push: $TAG"
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "version=$TAG" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Case 3: Triggered by push to master branch
          VER=$(grep -E '^\s*Version\s*=\s*"[^"]+"' version/version.go | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="v${VER#v}"
          echo "Current code version: $TAG"

          # Check if tag already exists in remote
          if git rev-parse "$TAG" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists on remote. Skipping release."
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if version/version.go was changed in this push
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if ! git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -q "^version/version.go$"; then
              echo "version/version.go was not modified in this push. Skipping release."
              echo "should_release=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "Version changed to $TAG and tag does not exist. Triggering automatic release!"
          echo "should_release=true" >> $GITHUB_OUTPUT
          echo "version=$TAG" >> $GITHUB_OUTPUT

  build-release:
    name: Build Release Binary (${{ matrix.os }}/${{ matrix.arch }})
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: linux
            arch: 386
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build Binary
        id: build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          GIT_COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          BUILD_TIME="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          LDFLAGS="-s -w -X 'github.com/esrrhs/spp/version.Version=${VERSION}' -X 'github.com/esrrhs/spp/version.GitCommit=${GIT_COMMIT}' -X 'github.com/esrrhs/spp/version.BuildTime=${BUILD_TIME}'"

          BIN_NAME="spp"
          if [ "${{ matrix.os }}" = "windows" ]; then
            BIN_NAME="spp.exe"
          fi

          go build -ldflags="${LDFLAGS}" -o "${BIN_NAME}" .

          ARCHIVE_NAME="spp_${VERSION}_${{ matrix.os }}_${{ matrix.arch }}"
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip "dist/${ARCHIVE_NAME}.zip" "${BIN_NAME}"
          else
            tar -czvf "dist/${ARCHIVE_NAME}.tar.gz" "${BIN_NAME}"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: [check-version, build-release]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: assets-*
          merge-multiple: true
          path: release-assets

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          files: release-assets/*
          generate_release_notes: true
