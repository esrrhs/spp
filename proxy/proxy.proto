syntax = "proto3";
option go_package = "./;proxy";

enum PROXY_PROTO {
    TCP = 0;
    UDP = 1;
    RUDP = 2;
    RICMP = 3;
    KCP = 4;
}

enum CLIENT_TYPE {
    // client fromaddr -> server toaddr
    PROXY = 0;
    // server fromaddr -> client toaddr
    REVERSE_PROXY = 1;
    // client fromaddr -> server
    SOCKS5 = 2;
    // server fromaddr -> client
    REVERSE_SOCKS5 = 3;
    // client fromaddr -> server shadowsocks address [SS_LOCAL_HOST:SS_LOCAL_PORT]
    SS_PROXY = 4;
}

// COMPRESS_TYPE selects payload compression. UNSPECIFIED means "use peer default".
enum COMPRESS_TYPE {
    COMPRESS_UNSPECIFIED = 0;
    COMPRESS_NONE = 1;
    COMPRESS_ZLIB = 2;
    COMPRESS_ZSTD = 3;
}

// ENCRYPT_TYPE selects frame encryption.
// NONE: no wire encryption.
// AES_GCM/CHACHA20: AEAD seals the whole protobuf on the wire (incl. LOGIN).
enum ENCRYPT_TYPE {
    ENCRYPT_UNSPECIFIED = 0;
    ENCRYPT_NONE = 1;
    reserved 2; // was ENCRYPT_RC4
    ENCRYPT_AES_GCM = 3;
    ENCRYPT_CHACHA20 = 4;
}

message LoginService {
    PROXY_PROTO proxyproto = 1;
    string fromaddr = 2;
    string toaddr = 3;
}

message LoginFrame {
    // Deprecated single-service fields; prefer services. Kept for one-slot convenience:
    // if services is empty, these define the only service.
    PROXY_PROTO proxyproto = 1;
    CLIENT_TYPE clienttype = 2;
    string fromaddr = 3;
    string toaddr = 4;
    // Optional client tag for logging/display only; not unique, not used for auth.
    string name = 5;
    reserved 6; // was plaintext key
    COMPRESS_TYPE compress_type = 7;
    ENCRYPT_TYPE encrypt_type = 8;
    // HMAC-SHA256(auth_key, challenge) from AUTH_CHALLENGE.
    bytes auth_proof = 9;
    // All local/remote services multiplexed on this main channel.
    repeated LoginService services = 10;
}

message LoginRspFrame {
    bool ret = 1;
    string msg = 2;
    // Agreed session codecs (echoed by server on success).
    COMPRESS_TYPE compress_type = 3;
    ENCRYPT_TYPE encrypt_type = 4;
    // Server-local session id; extra underlay pipes CHANNEL_JOIN with this id.
    uint64 session_id = 5;
}

message AuthChallengeFrame {
    bytes challenge = 1;
}

// Attach another underlay pipe to an existing session (same logical client).
message ChannelJoinFrame {
    uint64 session_id = 1;
    bytes auth_proof = 2;
}

message ChannelJoinRspFrame {
    bool ret = 1;
    string msg = 2;
}

// Throughput / health probe. Server echoes with echo=true and same payload size.
message SpeedTestFrame {
    int64 id = 1;
    int64 send_time = 2;
    bytes payload = 3;
    bool echo = 4;
}

message PingFrame {
    int64 time = 1;
}

message PongFrame {
    int64 time = 1;
}

message OpenConnFrame {
    string id = 1;
    string toaddr = 2;
    // Proxy protocol for the sonny dial/accept side.
    PROXY_PROTO proxyproto = 3;
    // Index into LoginFrame.services; pairs Inputer[i] with Outputer[i].
    int32 service_index = 4;
}

message OpenConnRspFrame {
    string id = 1;
    bool ret = 2;
    string msg = 3;
}

message CloseFrame {
    string id = 1;
}

message DataFrame {
    string id = 1;
    bool compress = 2;
    string crc = 3;
    bytes data = 4;
    int32 index = 5;
    // Set when compress=true so the peer knows which decoder to use.
    COMPRESS_TYPE compress_type = 6;
}

enum FRAME_TYPE {
    LOGIN = 0;
    LOGINRSP = 1;
    DATA = 2;
    PING = 3;
    PONG = 4;
    OPEN = 5;
    OPENRSP = 6;
    CLOSE = 7;
    AUTH_CHALLENGE = 8;
    CHANNEL_JOIN = 9;
    CHANNEL_JOIN_RSP = 10;
    SPEEDTEST = 11;
}

message ProxyFrame {
    FRAME_TYPE type = 1;
    LoginFrame loginFrame = 2;
    LoginRspFrame loginRspFrame = 3;
    DataFrame dataFrame = 4;
    PingFrame pingFrame = 5;
    PongFrame pongFrame = 6;
    OpenConnFrame openFrame = 7;
    OpenConnRspFrame openRspFrame = 8;
    CloseFrame closeFrame = 9;
    AuthChallengeFrame authChallengeFrame = 10;
    ChannelJoinFrame channelJoinFrame = 11;
    ChannelJoinRspFrame channelJoinRspFrame = 12;
    SpeedTestFrame speedTestFrame = 13;
}
